name: Validate SABLE PR 150

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch exact SABLE PR commit
        run: |
          git clone https://github.com/socksninja/sable-agent-reliability.git sable-source
          git -C sable-source checkout c5f189a9d9032f3d390ad9a364c17d59c984ddb4
      - name: Run repository unit tests at PR commit
        working-directory: sable-source
        run: python -m unittest discover -s tests -p 'test_*.py'
