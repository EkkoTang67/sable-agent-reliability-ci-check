name: Validate SABLE evidence and product contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify source snapshot metadata
        run: |
          grep -F "c5f189a9d9032f3d390ad9a364c17d59c984ddb4" docs/CI_SOURCE_MANIFEST.md
          test -f tests/test_commercial_surface.py
      - name: Run PR #150 commercial surface unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Execute synthetic commissioning evidence graph
        run: |
          python -m py_compile sable_commissioning_evidence_graph.py
          python3 sable_commissioning_evidence_graph.py --file examples/commissioning-evidence-graph.synthetic.json --root . --out /tmp/commissioning-evidence-receipt.json
          grep -F '"verdict": "VERIFIED"' /tmp/commissioning-evidence-receipt.json
      - name: Evaluate source-traceable adversarial benchmark
        run: |
          python3 data/commissioning_evidence_benchmark_v0/run_benchmark.py > /tmp/commissioning-benchmark.json
          grep -F '"failed": 0' /tmp/commissioning-benchmark.json
