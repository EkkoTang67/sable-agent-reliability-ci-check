name: Validate SABLE PR 150

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify source snapshot metadata
        run: |
          grep -F "c5f189a9d9032f3d390ad9a364c17d59c984ddb4" docs/CI_SOURCE_MANIFEST.md
          test -f tests/test_commercial_surface.py
      - name: Run PR #150 commercial surface unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
